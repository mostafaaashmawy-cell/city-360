# Cloudflare Pages configuration for City 360
# When wrangler finds `pages_build_output_dir`, `wrangler deploy`
# automatically deploys to Cloudflare Pages (not Workers).

name = "city-360"

# Use the `out/` folder generated by `next build` (output: 'export')
pages_build_output_dir = "out"

# Compatibility date — use a recent date for latest Cloudflare APIs
compatibility_date = "2024-09-23"
